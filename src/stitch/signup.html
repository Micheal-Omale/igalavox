<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign Up - Igala Heritage</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&amp;family=Noto+Serif:ital,wght@0,600;0,700;1,400&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#ffdcc6",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f6f3ee",
                        "on-surface": "#1c1c19",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e5e2dd",
                        "on-tertiary-fixed": "#241a00",
                        "tertiary-container": "#cba72f",
                        "surface-container-high": "#ebe8e3",
                        "on-secondary-container": "#795338",
                        "on-primary-fixed-variant": "#214f3f",
                        "surface-bright": "#fcf9f4",
                        "primary-fixed-dim": "#a0d1bc",
                        "inverse-primary": "#a0d1bc",
                        "surface-variant": "#e5e2dd",
                        "outline": "#717974",
                        "on-tertiary-fixed-variant": "#574500",
                        "surface": "#fcf9f4",
                        "on-secondary-fixed": "#2f1502",
                        "surface-dim": "#dcdad5",
                        "tertiary-fixed-dim": "#e9c349",
                        "inverse-surface": "#31302d",
                        "secondary": "#7c563b",
                        "on-surface-variant": "#414944",
                        "background": "#fcf9f4",
                        "on-secondary-fixed-variant": "#623f25",
                        "secondary-fixed-dim": "#efbc9b",
                        "outline-variant": "#c0c8c3",
                        "on-primary-fixed": "#002116",
                        "on-background": "#1c1c19",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#79a894",
                        "error-container": "#ffdad6",
                        "secondary-container": "#fecaa8",
                        "primary-fixed": "#bcedd7",
                        "primary": "#00261b",
                        "surface-tint": "#396756",
                        "surface-container": "#f0ede9",
                        "primary-container": "#0b3d2e",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#4e3d00",
                        "inverse-on-surface": "#f3f0eb",
                        "tertiary": "#735c00",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffe088"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "0.5rem",
                        "margin": "2rem",
                        "lg": "2rem",
                        "gutter": "1.5rem",
                        "xs": "0.25rem",
                        "base": "8px",
                        "xl": "4rem",
                        "md": "1rem"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "display": ["Noto Serif"],
                        "caption": ["Plus Jakarta Sans"],
                        "headline-md": ["Noto Serif"],
                        "headline-lg": ["Noto Serif"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .texture-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .ambient-shadow {
            box-shadow: 0 4px 24px -4px rgba(92, 58, 33, 0.08), 0 2px 8px -2px rgba(92, 58, 33, 0.04);
        }
    </style>
</head>

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="absolute inset-0 texture-overlay z-0"></div>
    <main class="flex-grow flex items-center justify-center p-6 relative z-10 w-full min-h-screen">
        <div
            class="w-full max-w-5xl bg-surface-container-lowest rounded-xl ambient-shadow overflow-hidden flex flex-col md:flex-row border border-[#5C3A21]/10">
            <!-- Left Side: Image/Context -->
            <div class="w-full md:w-5/12 bg-primary relative hidden md:block overflow-hidden">
                <img alt="Digital artistry version of a traditional African mask integrated into a sophisticated, abstract background with deep forest green and warm gold accents"
                    class="absolute inset-0 w-full h-full object-cover"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuBs9rs6AkcWOP-F0tR30ZWIm9Gkp2QQBYEBjfsDnNx5XtV51GJUC3pYwCuCybpoGGLSwb1kTH8c0Rgl0HZLumjFilPpy5m_2e8IP7-RI8Qnn-RHzz605Q_VL8u7sMwsnN10kdoNbrnMMEHPFtx9Rm4OGkEnbU4f-cnidZx5Y89iKrZmoSuHOSmDQHEKICHmFAyBH8EVzZXU97Imzgkc8HSSJATm4JogxhGAjtVXcdn7HhGMF9PxwKpq4BGS3yOS8z6rKqJQ6t7zs3hK" />
                <div class="absolute inset-0 bg-gradient-to-t from-[#0B3D2E]/80 via-transparent to-transparent"></div>
                <div class="relative h-full flex flex-col justify-end p-12 text-on-primary">
                    <h2 class="font-display text-display mb-4">Preserving Lineage.</h2>
                    <p class="font-body-lg text-body-lg text-on-primary/90 max-w-sm">
                        Join our digital archive to document, explore, and celebrate the rich heritage of the Igala
                        people.
                    </p>
                </div>
            </div>
            <!-- Right Side: Form -->
            <div class="w-full md:w-7/12 p-8 md:p-12 lg:p-16 flex flex-col justify-center bg-surface-container-lowest">
                <!-- Minimal Mobile Header inside Form area -->
                <div class="md:hidden flex items-center mb-12">
                    <span class="font-display text-headline-md text-primary tracking-tight font-bold">Igala
                        Heritage</span>
                </div>
                <div class="max-w-md w-full mx-auto">
                    <div class="mb-10 text-center md:text-left">
                        <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Create Account</h1>
                        <p class="font-body-md text-body-md text-on-surface-variant">Begin your journey into ancestral
                            preservation.</p>
                    </div>
                    <form class="space-y-6">
                        <div class="space-y-2">
                            <label class="block font-label-md text-label-md text-on-surface" for="fullName">Full
                                Name</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
                                <input
                                    class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md focus:border-[#C9A227] focus:ring-1 focus:ring-[#C9A227] outline-none transition-colors shadow-sm placeholder:text-outline-variant"
                                    id="fullName" name="fullName" placeholder="e.g. Attah Ayegba" type="text" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="block font-label-md text-label-md text-on-surface" for="email">Email
                                Address</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
                                <input
                                    class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md focus:border-[#C9A227] focus:ring-1 focus:ring-[#C9A227] outline-none transition-colors shadow-sm placeholder:text-outline-variant"
                                    id="email" name="email" placeholder="idoko@example.com" type="email" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="block font-label-md text-label-md text-on-surface"
                                for="password">Password</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
                                <input
                                    class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md focus:border-[#C9A227] focus:ring-1 focus:ring-[#C9A227] outline-none transition-colors shadow-sm placeholder:text-outline-variant"
                                    id="password" name="password" placeholder="••••••••" type="password" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="block font-label-md text-label-md text-on-surface" for="purpose">Why are you
                                joining?</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">explore</span>
                                <select
                                    class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md focus:border-[#C9A227] focus:ring-1 focus:ring-[#C9A227] outline-none transition-colors shadow-sm appearance-none"
                                    id="purpose" name="purpose">
                                    <option class="text-outline-variant" disabled="" selected="" value="">Select your
                                        primary interest</option>
                                    <option value="diaspora">Diaspora Member</option>
                                    <option value="researcher">Researcher / Scholar</option>
                                    <option value="parent">Parent Documenting Lineage</option>
                                    <option value="enthusiast">Cultural Enthusiast</option>
                                </select>
                                <span
                                    class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
                            </div>
                        </div>
                        <div class="pt-4">
                            <button
                                class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-6 rounded-lg shadow-sm hover:shadow-md hover:bg-primary-container hover:text-on-primary-container transition-all flex items-center justify-center gap-2"
                                type="button">
                                Create Account
                                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                            </button>
                        </div>
                    </form>
                    <div class="mt-8 text-center border-t border-[#A44A3F]/20 pt-8">
                        <p class="font-body-md text-body-md text-on-surface-variant">
                            Already preserving lineage?
                            <a class="font-label-md text-label-md text-tertiary-container hover:text-primary transition-colors ml-1 underline decoration-tertiary-container/30 hover:decoration-primary"
                                href="#">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
