    <style>
        .noise-overlay {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            mix-blend-mode: overlay;
        }

<body class="bg-background m-0 p-0 flex justify-center items-center min-h-screen">
    <!-- Container for Social Media Card Aspect Ratio (9:16) -->
    <div class="relative w-full max-w-[400px] aspect-[9/16] overflow-hidden rounded-3xl shadow-2xl flex flex-col items-center justify-between py-12 px-8"
        style="background: linear-gradient(135deg, #D4AF37 0%, #A44A3F 100%);">
        <!-- Texture Overlay -->
        <div class="noise-overlay z-0"></div>
        <!-- Top Section: Tag -->
        <div class="z-10 mt-margin">
            <span
                class="bg-surface-bright/20 backdrop-blur-sm text-surface-bright font-label-md text-label-md px-4 py-2 rounded-full border border-surface-bright/30 shadow-[0_4px_12px_rgba(92,58,33,0.05)] uppercase">
                SPIRITUAL • ♂/♀/UNISEX
            </span>
        </div>
        <!-- Centerpiece: Name and Meaning -->
        <div class="z-10 flex flex-col items-center justify-center flex-grow space-y-lg w-full">
            <!-- Name -->
            <h1 class="text-surface-bright font-display text-display text-center drop-shadow-md">
                Enwukedogba
            </h1>
            <!-- Meaning (Glassmorphic Box) -->
            <div
                class="bg-surface-bright/10 backdrop-blur-md border border-surface-bright/20 rounded-2xl px-6 py-4 w-full max-w-[85%] text-center shadow-[0_8px_32px_rgba(0,38,27,0.15)]">
                <p class="text-surface-bright font-headline-md text-headline-md italic">
                    "Heart desire"
                </p>
            </div>
        </div>
        <!-- Bottom Section: Origin Story -->
        <div class="z-10 w-full mb-lg">
            <div class="bg-surface/10 backdrop-blur-lg rounded-2xl p-6 border border-surface/20 shadow-lg">
                <h2
                    class="text-surface-bright/80 font-label-md text-label-md uppercase mb-sm tracking-widest text-center">
                    Origin Story
                </h2>
                <p class="text-surface-bright font-body-md text-body-md text-center leading-relaxed opacity-90">
                    A profound reflection of deep longing and fulfillment. Often given to a child long awaited,
                    symbolizing the ultimate manifestation of the family's deepest prayers and enduring hopes.
                </p>
            </div>
        </div>
        <!-- Footer: Branding -->
        <div class="z-10 mb-sm">
            <p class="text-surface-bright/60 font-caption text-caption uppercase tracking-widest">
                — Igalavox —
            </p>
        </div>
    </div>
</body>

</html>
